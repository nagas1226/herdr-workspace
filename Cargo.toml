[package]
name = "herdr-workspace"
version = "0.1.0"
edition = "2021"
description = "Herdr plugin: create a workspace and apply a layout profile from a centered popup."
license = "MIT"
rust-version = "1.74"
repository = "https://github.com/zackshen/herdr-workspace"

[[bin]]
name = "herdr-workspace"
path = "src/main.rs"

[dependencies]
ratatui = "0.29"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
opt-level = "z"
